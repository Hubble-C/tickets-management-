services:
  mysql:
    image: mysql:8.0
    container_name: tickets-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: tickets_management
    ports:
      - "3306:3306"
    volumes:
      - tickets-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  tickets-mysql-data:
